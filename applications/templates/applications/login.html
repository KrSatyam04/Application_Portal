{% extends 'applications/base.html' %}

{% block content %}
<section class="card">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    <label>Username
      <input type="text" name="username" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="button">Login</button>
  </form>
</section>
{% endblock %}
